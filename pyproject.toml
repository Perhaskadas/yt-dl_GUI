[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-dlp-gui"
dynamic = ["version"]
description = "A GUI wrapper for yt-dlp using pywebview"
requires-python = ">=3.10"
dependencies = [
  "pywebview>=6.2.1",
  "yt-dlp[default]>=2026.10.26",
  "yt-dlp-ejs>=0.8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.yt-dlp-gui]
system-requires = ["ffmpeg", "deno"]
