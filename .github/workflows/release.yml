name: Build release executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # One-dir, not one-file: one-file unpacks itself on every launch, which
          # delays app start and every download (each runs yt-dlp as a child copy)
          pyinstaller `
            --noconsole `
            --onedir `
            --name "yt-dlp-gui" `
            --icon "src/assets/yt-dlp-gui.ico" `
            --collect-all webview `
            --add-data "src/ui;ui" `
            --add-data "src/assets;assets" `
            src/app/main.py
          # Zip the whole folder: yt-dlp-gui.exe needs the _internal folder beside it
          Compress-Archive -Path dist/yt-dlp-gui -DestinationPath dist/yt-dlp-gui-windows.zip -Force

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # One-dir .app (see the Windows step for why not one-file)
          pyinstaller \
            --windowed \
            --onedir \
            --name "yt-dlp-gui" \
            --icon "src/assets/yt-dlp-gui.icns" \
            --collect-all webview \
            --add-data "src/ui:ui" \
            --add-data "src/assets:assets" \
            src/app/main.py
          ditto -c -k --sequesterRsrc --keepParent "dist/yt-dlp-gui.app" "dist/yt-dlp-gui-macos.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
